# LibreLane configuration for the Mini-TPU
# Targets a single TinyTapeout (Skywater shuttle) tile of 160 x 100 um.
# Run from inside the librelane nix-shell:
#   cd /mnt/fda14e36-49c8-4508-a4b0-f37189565cd9/Base/VLSI_DESIGN/librelane
#   nix-shell
#   librelane /mnt/fda14e36-49c8-4508-a4b0-f37189565cd9/Base/Workshop_2026/Mini-TPU/config.yaml

# ---------- Basics ----------
DESIGN_NAME: tt_um_tpu
PDK: sky130A

VERILOG_FILES:
  - dir::src/tt_um_tpu.v
  - dir::src/tpu_interface.v
  - dir::src/tpu.v
  - dir::src/control.v
  - dir::src/memory.v
  - dir::src/array.v
  - dir::src/pe.v
  - dir::src/spi.v

# NOTE: USE_POWER_PINS is intentionally NOT in VERILOG_DEFINES for the
# local librelane flow. With it defined, the top-level inout VPWR/VGND
# ports survive into the netlist and add power-grid routing that, on
# this 160x100 die, eats just enough cell-area budget that detailed
# placement fails after CTS ([DPL-0036]). The TT GDS workflow defines
# USE_POWER_PINS itself; the source still carries the canonical guards
# in `tt_um_tpu.v` so that path produces the standard TT-shaped netlist.

# ---------- Clock ----------
# Loose enough that hold/setup don't force heavy buffering. The TT pin
# advertises 1 MHz; 50 ns (20 MHz) is still 20x faster than spec.
CLOCK_PORT: clk
CLOCK_PERIOD: 20

# ---------- Floorplan: absolute 167 x 108 um TT 1x1 tile ----------
# Using the canonical Tiny Tapeout 1x1 dimensions (per info.yaml: "a
# single tile is about 167x108 uM"). The earlier 160x100 footprint
# left only 15.5k um^2 of core — once CTS added 64 clock buffers and
# 54 timing-repair buffers (post-CTS area: 14.7k um^2), density hit
# ~95% and DPL-0036 fired with 35 unplaceable instances. 167x108
# gives ~18k um^2 of core, dropping post-CTS density to ~82% with
# comfortable legalisation margin.
FP_SIZING: absolute
DIE_AREA: [0, 0, 167, 108]
# Tight margin to maximize placeable area (pins extend 1 um into the core).
CORE_AREA: [1, 1, 166, 107]

# Longer pin stubs help the router connect cells to top-edge pins
# cleanly. With 2 um pins, the router occasionally couldn't reach
# constant-tied output pins (uo_out[7], uio_oe[7]) on the new
# 167x108 floorplan, leaving them shorted in magic extraction
# and breaking LVS with 24 errors.
IO_PIN_H_LENGTH: 4
IO_PIN_V_LENGTH: 4

# ---------- Synthesis: aggressive area mapping ----------
SYNTH_STRATEGY: "AREA 0"
SYNTH_ABC_BUFFERING: false

# Match the values that fit at RUN_2026-05-09_12-58-11 (cell area
# 12.7k µm² in a 15.5k µm² core, ~82% density before CTS). Tighter
# values (75/90) tip the legalizer over after CTS adds clock buffers.
FP_CORE_UTIL: 45
PL_TARGET_DENSITY_PCT: 75

PL_RESIZER_HOLD_SLACK_MARGIN: 0.0
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.0

# Don't add output buffers on package-pin outputs — TT pads handle drive.
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false

# ---------- Power grid (TT macro: lower layers only, no rings) ----------
PDN_MULTILAYER: false
RT_MAX_LAYER: met4
PDN_VPITCH: 38.87

# ---------- Routing: allow some congestion since the tile is dense ----------
GRT_ALLOW_CONGESTION: true

# ---------- Signoff trims ----------
RUN_KLAYOUT_XOR: false
RUN_KLAYOUT_DRC: true

# Magic LEF: pin-only export (matches TT integration expectations)
MAGIC_DEF_LABELS: false
MAGIC_WRITE_LEF_PINONLY: true
